[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pysyskit"
version = "0.1.0"
description = "A modular Python toolkit for system diagnostics, administration, and automation."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "psutil>=5.9,<8.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0"
]

[project.scripts]
pysyskit = "pysyskit.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
